<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Star Clock</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#060b14;
    font-family: system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; }
  #t { color:#eaf2ff; letter-spacing:.06em; font-weight:700;
    font-size: clamp(32px, 6vw, 84px);
    text-shadow: 0 20px 40px rgba(0,0,0,.45); }
  #hint { position:fixed; left:14px; bottom:12px; color: rgba(234,242,255,.7);
    font-size:12px; user-select:none; }
</style>
<canvas id="c"></canvas>
<div id="hud"><div id="t">--:--:--</div></div>
<div id="hint">点击切换配色 · 按 S 暂停/继续</div>
<script>
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const tEl = document.getElementById("t");
  let W, H, dpr, run = true;

  const palettes = [
    ["#060b14", "#6be3ff", "#a7ff83"],
    ["#0b0620", "#ff6bcb", "#ffd36b"],
    ["#060f0a", "#77ffb5", "#6be3ff"],
  ];
  let pi = 0;

  function resize() {
    dpr = Math.max(1, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener("resize", resize); resize();

  const N = 160;
  const ps = Array.from({length:N}, () => ({
    x: Math.random()*W,
    y: Math.random()*H,
    v: 0.2 + Math.random()*1.2,
    r: 0.6 + Math.random()*1.8,
    a: 0.2 + Math.random()*0.8,
    ph: Math.random()*Math.PI*2
  }));

  function tickTime(){
    const d = new Date();
    const z = n => String(n).padStart(2,"0");
    tEl.textContent = `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
  }
  setInterval(tickTime, 250); tickTime();

  function draw(){
    if(!run){ requestAnimationFrame(draw); return; }
    const [bg] = palettes[pi];
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = "lighter";
    for(const p of ps){
      p.y += p.v;
      if(p.y > H + 20){ p.y = -20; p.x = Math.random()*W; }
      const tw = Math.sin(Date.now()*0.001 + p.ph) * 0.6;
      ctx.beginPath();
      ctx.fillStyle = `rgba(107,227,255,${p.a})`;
      ctx.arc(p.x + tw*6, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    for(let i=0;i<ps.length;i++){
      for(let j=i+1;j<ps.length;j++){
        const a = ps[i], b = ps[j];
        const d = Math.hypot(a.x-b.x, a.y-b.y);
        if(d < 110){
          const k = 1 - d/110;
          ctx.strokeStyle = `rgba(167,255,131,${0.18*k})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(draw);
  }
  draw();

  addEventListener("click", () => { pi = (pi + 1) % palettes.length; });
  addEventListener("keydown", e => { if(e.key.toLowerCase()==="s") run = !run; });
</script>
